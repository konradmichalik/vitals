name: VitalsApp
options:
  bundleIdPrefix: com.konradmichalik
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

targets:
  VitalsApp:
    type: application
    platform: macOS
    sources:
      - VitalsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konradmichalik.vitals
        PRODUCT_NAME: VitalsApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: VitalsApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: VitalsApp/VitalsApp.entitlements
        # No Apple Developer account exists for this project — matching
        # cc-usage-bar's approach (see its CI release workflow), which
        # ships ad-hoc signed with no DEVELOPMENT_TEAM at all. Ad-hoc
        # ("-") gives UNUserNotificationCenter a resolvable identity;
        # Xcode's own "Sign to Run Locally" default does not, which is
        # what caused the earlier crash.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        # Xcode's Debug-only "build the app as a dylib behind a stub
        # executor" optimization (for faster incremental builds) breaks
        # UNUserNotificationCenter's bundle-identity resolution — it
        # crashed on every launch in Debug while an identically-signed
        # Release build ran fine. Disabling it makes Debug behave like a
        # normal, real app launch.
        ENABLE_DEBUG_DYLIB: NO
        # vitals-ffi is a member of the root Cargo workspace, so its build
        # output lands in the shared workspace target/, not a local one.
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/../target/release"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/VitalsApp/Bridge"
        OTHER_LDFLAGS: "-lvitals_ffi"
        SWIFT_OBJC_BRIDGING_HEADER: "VitalsApp/Bridge/vitals.h"

    preBuildScripts:
      - name: Build Rust FFI
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd "$PROJECT_DIR/.."
          cargo build --release -p vitals-ffi 2>&1
        basedOnDependencyAnalysis: false

  VitalsAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - VitalsAppTests
    dependencies:
      - target: VitalsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.konradmichalik.vitals.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  VitalsApp:
    build:
      targets:
        VitalsApp: all
        VitalsAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VitalsAppTests
